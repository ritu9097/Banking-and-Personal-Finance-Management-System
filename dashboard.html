<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5146e5">

  <title>Dashboard — Finora</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="dashboard">

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <span class="logo">F</span>
      <span>Finora</span>
    </div>

    <div class="side-title">MAIN MENU</div>

    <nav aria-label="Main navigation">

      <a data-page-link="dashboard" href="dashboard.html">
        ⌂ <span>Dashboard</span>
      </a>

      <a data-page-link="accounts" href="accounts.html">
        ▣ <span>Accounts</span>
      </a>

      <a data-page-link="transactions" href="transactions.html">
        ↔ <span>Transactions</span>
      </a>

      <a data-page-link="income" href="income.html">
        ↗ <span>Income</span>
      </a>

      <a data-page-link="expenses" href="expenses.html">
        ↘ <span>Expenses</span>
      </a>

      <a data-page-link="budgets" href="budgets.html">
        ▤ <span>Budgets</span>
      </a>

      <a data-page-link="savings" href="savings.html">
        ◎ <span>Savings Goals</span>
      </a>

      <a data-page-link="analytics" href="analytics.html">
        ◔ <span>Analytics</span>
      </a>

      <a data-page-link="profile" href="profile.html">
        ⚙ <span>Profile</span>
      </a>

    </nav>

    <button class="logout" id="logout" type="button">
      ↪ <span>Logout</span>
    </button>

  </aside>


  <!-- MOBILE OVERLAY -->
  <div class="overlay" id="overlay"></div>


  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">

      <button
        class="menu"
        id="menu"
        type="button"
        aria-label="Open navigation menu"
      >
        ☰
      </button>

      <div>

        <div class="eyebrow">
          FINORA FINANCE
        </div>

        <h1>Dashboard</h1>

        <p class="muted">
          Your financial overview at a glance.
        </p>

      </div>


      <!-- TOP RIGHT ACTIONS -->
      <div class="top-right">

        <button
          class="icon-btn"
          type="button"
          aria-label="Search"
        >
          ⌕
        </button>

        <button
          class="icon-btn"
          type="button"
          aria-label="Notifications"
        >
          ♧
        </button>

        <a
          class="avatar"
          id="avatar"
          href="profile.html"
          aria-label="Open profile"
        >
          U
        </a>

      </div>

    </header>


    <!-- DASHBOARD CONTENT
         app.js dynamically renders the dashboard here -->
    <section
      id="content"
      class="content dashboard-content"
    ></section>

  </main>

</div>


<!-- MODAL -->
<div id="modal"></div>

<!-- TOAST -->
<div id="toast"></div>


<script src="js/app.js"></script>

</body>
</html>
