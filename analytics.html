<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0D1B2A">
  <title>Analytics — Finora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <script>
    (function(){
      document.documentElement.setAttribute('data-theme', localStorage.getItem('finora_theme') || 'light');
      if (localStorage.getItem('finora_hide_balance') === 'true') {
        document.documentElement.setAttribute('data-hide-balance', 'true');
      }
    })();
  </script>
</head>
<body data-page="analytics">

<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><span class="logo">F</span><span>Finora</span></div>
    <div class="side-title">MAIN MENU</div>
    <nav aria-label="Main navigation">
      <a data-page-link="dashboard" href="dashboard.html" aria-label="Dashboard" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a>
      <a data-page-link="accounts" href="accounts.html" aria-label="Accounts" title="Accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span>Accounts</span></a>
      <a data-page-link="transactions" href="transactions.html" aria-label="Transactions" title="Transactions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/></svg><span>Transactions</span></a>
      <a data-page-link="income" href="income.html" aria-label="Income" title="Income"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>Income</span></a>
      <a data-page-link="expenses" href="expenses.html" aria-label="Expenses" title="Expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span>Expenses</span></a>
      <a data-page-link="budgets" href="budgets.html" aria-label="Budgets" title="Budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span>Budgets</span></a>
      <a data-page-link="savings" href="savings.html" aria-label="Savings Goals" title="Savings Goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span>Savings Goals</span></a>
      <a data-page-link="analytics" href="analytics.html" aria-label="Analytics" title="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/></svg><span>Analytics</span></a>
      <a data-page-link="profile" href="profile.html" aria-label="Profile" title="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
    </nav>
    <button class="logout" id="logout" type="button" aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></button>
  </aside>

  <!-- Mobile overlay -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <main class="main">
  <header class="topbar">
    <button class="menu" id="menu" type="button" aria-label="Open navigation menu" title="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div>
      <div class="eyebrow">FINORA FINANCE</div>
      <h1>Analytics</h1>
      <p class="muted">Deep dive into your finances.</p>
    </div>
    <div class="top-right" id="topRight">
      <button class="icon-btn" id="eyeBtn" type="button" aria-label="Hide balances" title="Toggle balance visibility"><svg id="eyeIconSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search transactions and accounts" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button class="icon-btn" id="notifBtn" type="button" aria-label="View notifications" title="Notifications" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notification-dot"></span></button>
      <a class="avatar" id="avatar" href="profile.html" aria-label="Open user profile" title="Profile">U</a>
    </div>
  </header>
    <section id="content" class="content" aria-live="polite"></section>
  </main>

</div>

<!-- Search popover -->
<div id="searchPopover" class="search-popover hidden" role="dialog" aria-label="Search popover">
  <input id="globalSearch" class="input" placeholder="Search transactions, accounts..." aria-label="Search transactions and accounts" autocomplete="off">
  <div id="searchResults" class="search-results-list"></div>
</div>

<!-- Notification popover -->
<div id="notifPopover" class="notification-popover hidden" role="dialog" aria-label="Notifications popover">
  <div style="font-weight:700;font-size:.85rem;margin-bottom:8px;color:var(--text)">Notifications</div>
  <div id="notifList" class="notification-list"></div>
</div>

<div id="modal" aria-live="assertive"></div>
<div id="toast"  aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
